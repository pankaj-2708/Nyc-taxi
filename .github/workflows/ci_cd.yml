name: CI CD pipeline

on:
    push

jobs:
    build:
        runs-on: hyp_tunning

        steps:
            - uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: setup_cml
              uses: iterative/setup-cml@v1
          
            - name: checkout repo
              uses: actions/checkout@v3
              

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: 3.12

            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r ./src/dvc_pipeline/requirements.txt

            - name: Configure Aws credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: creating_directories
              run: |
                mkdir -p ./data/raw
                mkdir -p ./model

            - id: install-aws-cli
              uses: unfor19/install-aws-cli-action@v1
              with:
                version: 2                         # default
                verbose: false                     # default
                arch: amd64                        # allowed values: amd64, x86, x64, arm, arm64

            - name: Download Dataset from S3
              run: aws s3 cp s3://nyc-taxi/dataset.csv ./data/raw/
            
            - name: running pipeline
              run: | 
                dvc exp run

            - name: creating report
              env:
                REPO_TOKEN: ${{secrets.Github_token}}
              run: |
                python ./src/generate_report.py
                cml comment create report.md
            
            - name: copying files
              run: |
               cp ./data/interim/ppl.pkl ./model/ppl.pkl
               cp ./data/interim/fn_y.pkl ./model/fn_y.pkl

            - name: uploading data
              uses: actions/upload-artifact@v4
              with:
                name: models
                path: ./model/*

      
    build_image_and_push_to_ecr:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v3

        - name: download build data
          uses: actions/download-artifact@v4
          with:
              name: models
              path: ./model/
        - name: copying files
          run: cp -r ./model/ ./src/Webapp/Backend/model/

        - name: Configure Aws credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2
        
        - name: build_docker_image
          id: build-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
            ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_NAME_BACKEND }}
            IMAGE_TAG: latest
          run: |
            cd ./src/Webapp/Backend
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT
            cd ../Frontend
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    deploy_webapp:
      needs: build_image_and_push_to_ecr
      runs-on: nyc_taxi

      steps:
        - name: checkout repo
          uses: actions/checkout@v3
          
        - name: Configure Aws credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2
          
        - name: run docker compose
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
            ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_NAME_BACKEND }}
            IMAGE_TAG: latest
          run:
            docker compose down
            docker compose pull
            timeout 600 docker compose up


